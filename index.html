<style>

  .kc { min-width: 54px; text-align: right; font-variant-numeric: tabular-nums; }
  .acts { display: flex; gap: 8px; margin-top: 10px; }
  .acts button { flex: 1; height: 36px; font-size: 13px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .foot { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .foot button { display: block; width: 100%; max-width: 444px; margin: 0 auto; height: 52px; border-radius: 99px; font-size: 16px; font-weight: 700; background: var(--accent); color: var(--on-accent); }
  .foot button.done { background: var(--card); color: var(--ok); }

  .sheet h2 { font-size: 18px; font-weight: 700; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
  .sheet h2 button { font-size: 13px; font-weight: 400; background: var(--card); border-radius: 99px; padding: 6px 12px; }
  .list { background: var(--card); border-radius: 16px; margin-top: 10px; overflow: hidden; }

  .pick:first-child { border-top: 0; }
  .btn-soft { width: 100%; height: 44px; margin-top: 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .btn-main { width: 100%; height: 48px; margin-top: 12px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom)); background: var(--text); color: var(--bg); border-radius: 99px; padding: 10px 8px 10px 16px; font-size: 13px; display: flex; align-items: center; gap: 10px; z-index: 20; white-space: nowrap; }

  .bal b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }

  .bal b.minus { color: var(--ok); }

  .arow input { width: 84px; text-align: right; padding: 7px 10px; border-radius: 99px; font-variant-numeric: tabular-nums; }
  .arow input.s { width: 64px; }

  .loading { text-align: center; color: var(--sub); padding: 80px 0; }
</style>

<body>
<div class="wrap" id="app"><div class="loading">読み込み中…</div></div>
<div class="foot" id="foot" style="display:none"><button id="saveBtn" onclick="save()">記録する</button></div>
<div id="sheet"></div>
<div class="toast" id="toast" style="display:none"></div>

<script>
const S = { meals: [], foods: [], fmap: {}, sets: [], conf: {}, date: '', day: null, items: [], weight: null, dirty: false, sending: false, again: false, failed: false };

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r = n => Math.round(n);
const fmt1 = n => n < 10 ? String(Math.round(n * 10) / 10) : String(Math.round(n));
const fmtDate = s => { const d = new Date(s + 'T00:00:00'); return `${d.getMonth() + 1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`; };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => ymd(new Date());
const shift = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };

function setFoods(foods) { S.foods = foods; S.fmap = {}; foods.forEach(f => S.fmap[f.name] = f); }
// 食品マスタの値、なければ「今回だけ」の値（it.once）
const foodOf = it => S.fmap[it.name] || it.once;

function loadDay(day) {
  S.day = day; S.date = day.date;
  S.items = day.items.map(i => ({ ...i }));
  S.weight = day.weight;
  S.act = { ...(day.act || { steps: 0, runKm: 0, runMin: 0, other: 0 }) };
  S.dirty = false; S.failed = false; S.wTouched = false; S.aTouched = false;
  render();
}

function saveBase() { cacheSet('base', { meals: S.meals, sets: S.sets, conf: S.conf, foods: S.foods }); }
const sheetOpen = () => !!document.getElementById('sheet').innerHTML;

// サーバーから届いた最新を反映する。入力中・送信中・シート表示中は日付データを書き換えない
function applyInit(d) {
  S.meals = d.meals; S.sets = d.sets; S.conf = d.conf; setFoods(d.foods); saveBase();
  cacheSet('day:' + d.day.date, d.day);
  if (!S.day || (d.day.date === S.date && !S.dirty && !S.sending && !sheetOpen())) loadDay(d.day);
}

async function init() {
  const base = cacheGet('base'), day = cacheGet('day:' + today());
  if (base && day) { S.meals = base.meals; S.sets = base.sets; S.conf = base.conf; setFoods(base.foods); loadDay(day); }
  try {
    applyInit(await call('getInit', today()));
    prefetch(shift(today(), -1));
  } catch (e) {
    if (!S.day) document.getElementById('app').innerHTML = `<div class="loading">読み込めませんでした。<br>${esc(e.message || e)}</div>`;
  }
}

// 前の日のデータを先に取っておく（‹ を押したときにすぐ出るように）
function prefetch(date) {
  if (cacheGet('day:' + date)) return;
  call('getDay', date).then(d => cacheSet('day:' + date, d)).catch(() => {});
}

async function go(n) {
  flushSave(); // 移動する前に、まだ送っていない変更を保存
  const date = shift(S.date, n);
  if (date > today()) return;
  const hit = cacheGet('day:' + date);
  if (hit) loadDay(hit);
  else { S.date = date; S.day = null; document.getElementById('app').innerHTML = '<div class="loading">読み込み中…</div>'; }
  try {
    const d = await call('getDay', date);
    cacheSet('day:' + date, d);
    if (S.date === date && !S.dirty && !S.sending) loadDay(d);
  } catch (e) {
    if (!hit && S.date === date) document.getElementById('app').innerHTML = `<div class="loading">読み込めませんでした。<br>${esc(e.message || e)}</div>`;
  }
  prefetch(shift(date, -1));
}

function totals() {
  const t = { kcal: 0, p: 0, f: 0, c: 0 };
  S.items.forEach(i => { const f = foodOf(i); if (!f) return; ['kcal', 'p', 'f', 'c'].forEach(k => t[k] += f[k] * i.qty); });
  return t;
}

function touch() { S.dirty = true; render(); scheduleSave(); }

// ---- 自動保存：変更が止まって1.2秒たったら裏で保存する ----
let autoTimer = null;
function scheduleSave() { clearTimeout(autoTimer); autoTimer = setTimeout(save, 1200); }
function flushSave() { clearTimeout(autoTimer); if (S.dirty) save(); }

function statusInfo() {
  const day = S.day;
  if (S.failed) return ['err', '保存できませんでした。下のボタンからもう一度試してください'];
  if (S.dirty || S.sending) return ['', '保存中…'];
  if (day.copiedFrom) return ['copied', `${fmtDate(day.copiedFrom)}の記録をコピーしました。変わったところだけ直すと自動で保存されます`];
  if (day.saved) return ['ok', '✓ 自動保存済み'];
  return ['', '「＋ 食品」から食べたものを追加してください（自動で保存されます）'];
}
// 画面全体は描き直さずに状態表示だけ更新する（入力中のフォーカスを奪わないため）
function updateStatus() {
  const st = document.querySelector('.status');
  if (st) { const [c, t] = statusInfo(); st.className = 'status ' + c; st.textContent = t; }
  renderFoot();
}
function qty(idx, d) {
  if (S.items[idx].qty + d <= 0) return removeItem(idx);
  S.items[idx].qty += d; touch();
}

// 削除（直後なら「元に戻す」できる）
let toastTimer = null;
function removeItem(idx) {
  const [it] = S.items.splice(idx, 1);
  touch();
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${esc(it.name)}を削除しました</span><button>元に戻す</button>`;
  el.style.display = '';
  el.querySelector('button').onclick = () => { S.items.splice(idx, 0, it); hideToast(); touch(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 4000);
}
function hideToast() { document.getElementById('toast').style.display = 'none'; }
// 入力中は全体を描き直さず（フォーカスが外れるため）、収支と状態表示だけ更新する
function softUpdate() {
  S.dirty = true; updateStatus(); scheduleSave();
  const bal = document.getElementById('bal'); if (bal) bal.innerHTML = balHtml();
  const ak = document.getElementById('act-kcal'); if (ak) { const b = burn(); ak.textContent = `${r(b.walk + b.run + b.other)} kcal`; }
}
function setWeight(v) { const n = parseFloat(v); S.weight = isNaN(n) ? null : Math.round(n * 10) / 10; S.wTouched = true; softUpdate(); }
function setAct(k, v) { const n = parseFloat(v); S.act[k] = isNaN(n) ? 0 : n; S.aTouched = true; softUpdate(); }

// 消費カロリー（目安）＝ 基礎代謝×活動係数 ＋ 歩行 ＋ ランニング ＋ その他運動
function burn() {
  const c = S.conf, a = S.act, w = S.weight || c.weight || 60;
  const bmr = c.height && c.age && c.sex ? 10 * w + 6.25 * c.height - 5 * c.age + (c.sex.startsWith('女') ? -161 : 5) : null;
  const base = bmr ? bmr * c.factor : w * 30; // 身長・年齢・性別が未設定なら体重×30で仮置き
  const walk = (a.steps || 0) * w * 0.0004, run = (a.runKm || 0) * w, other = a.other || 0;
  return { bmr, base, walk, run, other, total: base + walk + run + other, rough: !bmr };
}

function balHtml() {
  const t = totals(), b = burn(), d = t.kcal - b.total;
  return `<div class="bal">
      <div><span class="sub">摂取</span><b>${r(t.kcal).toLocaleString()}</b></div><span class="op">−</span>
      <div><span class="sub">消費</span><b>${r(b.total).toLocaleString()}</b></div><span class="op">=</span>
      <div><span class="sub">収支</span><b class="${d < 0 ? 'minus' : 'plus'}">${d < 0 ? '−' : '+'}${r(Math.abs(d)).toLocaleString()}</b></div>
    </div>
    <div class="fat ${d < 0 ? 'minus' : 'plus'}">脂肪にすると 約${d < 0 ? '−' : '+'}${r(Math.abs(d) / 7.2)}g</div>
    <div class="bal-note">消費＝${b.rough ? `基礎 ${r(b.base).toLocaleString()}` : `基礎代謝 ${r(b.bmr).toLocaleString()}×${S.conf.factor}`} ＋ 歩行 ${r(b.walk)} ＋ ラン ${r(b.run)} ＋ 他 ${r(b.other)} kcal ／ 脂肪1kg ≒ 7,200kcal${b.rough ? '<br>※身長・年齢・性別が未設定のため仮の値です' : ''}</div>`;
}

function numInput(k, val, cls, ph) {
  return `<input class="${cls || ''}" type="number" inputmode="decimal" min="0" value="${val || ''}" placeholder="${ph || '0'}" oninput="setAct('${k}',this.value)">`;
}
function stepWeight(d) { S.weight = Math.round(((S.weight || S.conf.weight || 60) + d) * 10) / 10; S.wTouched = true; touch(); }

function bar(v, goal) {
  const pct = goal ? Math.min(100, v / goal * 100) : 0;
  return `<div class="bar ${goal && v > goal ? 'over' : ''}"><div style="width:${pct}%"></div></div>`;
}

function stepper(val, minus, plus, label) {
  return `<span class="step"><button onclick="${minus}" aria-label="${label}を減らす">−</button><span>${val}</span><button onclick="${plus}" aria-label="${label}を増やす">＋</button></span>`;
}

function render() {

// 下のボタンは「コピーした内容をそのまま記録する」ときと「保存に失敗したとき」だけ出す
function renderFoot() {
  const foot = document.getElementById('foot'), b = document.getElementById('saveBtn');
  const copiedUnsaved = S.day.copiedFrom && !S.day.saved && !S.dirty && !S.sending;
  foot.style.display = S.failed || copiedUnsaved ? '' : 'none';
  b.className = '';
  b.textContent = S.failed ? 'もう一度保存する' : 'この内容で記録する';
}

// 押した瞬間に「保存済み」にして、送信は裏で行う。失敗したときだけ未保存に戻して知らせる
// 保存は裏で行う。失敗したら未保存に戻して、下に「もう一度保存する」を出す
async function save() {
  clearTimeout(autoTimer);
  if (S.day.saved && !S.dirty && !S.failed) return;
  if (S.sending) { S.again = true; return; }
  // 体重・活動は、この画面で触ったときだけ送る（ヘルスケアから自動で入った値を古い値で上書きしないため）
  const date = S.date, items = S.items.filter(i => i.qty > 0);
  const weight = S.wTouched ? S.weight : null, act = S.aTouched ? { ...S.act } : null;
  S.dirty = false; S.failed = false; S.wTouched = false; S.aTouched = false; S.day = { ...S.day, saved: true, copiedFrom: '' }; S.sending = true;
  updateStatus();
  try {
    const d = await call('saveDay', date, items, weight, act);
    cacheSet('day:' + date, d);
    if (S.date === date && !S.dirty) S.day = d;
  } catch (e) {
    if (S.date === date) { S.dirty = true; S.failed = true; S.day = { ...S.day, saved: false }; }
  } finally {
    S.sending = false; updateStatus();
    if (S.again) { S.again = false; if (S.dirty && !S.failed) save(); }
  }
}

// ---- トレーナー ----
function coachHtml() {
  const k = S.day && S.day.coach;
  const head = `<div class="meal-h"><b>トレーナー</b>${k ? `<span class="sub">${esc(k.at)} のコメント</span>` : ''}</div>`;
  if (S.coachLoading) return head + '<div class="sub" style="padding:14px 0">今日の記録を見ています…（20秒ほどかかります）</div>';
  const err = S.coachErr ? `<div class="err">${esc(S.coachErr)}</div>` : '';
  if (!k) return head + `<div class="sub" style="margin-top:6px">今日の食事・活動・直近2週間の流れを見て、よかった点と改善点を教えてくれます。</div>${err}
    <button class="btn-soft" onclick="askCoach()">今日のフィードバックをもらう</button>`;
  const li = (arr, mark, col) => arr.map(x => `<li><span style="color:var(${col})">${mark}</span>${esc(x)}</li>`).join('');
  return head + `<div class="coach">
      <p class="sum">${esc(k.summary)}</p>
      ${k.good.length ? `<ul>${li(k.good, '○', '--ok')}</ul>` : ''}

      <p class="nx"><b>次は：</b>${esc(k.next)}</p>
    </div>${err}
    <button class="btn-soft" onclick="askCoach()">今の記録でもう一度聞く</button>`;
}

async function askCoach() {
  flushSave();
  const t = totals(), b = burn();
  const items = S.items.filter(i => i.qty > 0).map(i => {
    const f = foodOf(i) || { kcal: 0, p: 0, f: 0, c: 0 };
    return { meal: i.meal, name: i.name, qty: i.qty, kcal: f.kcal * i.qty, p: fmt1(f.p * i.qty), f: fmt1(f.f * i.qty), c: fmt1(f.c * i.qty) };
  });
  const date = S.date;
  S.coachLoading = true; S.coachErr = '';
  const card = () => { const el = document.getElementById('coach-card'); if (el) el.innerHTML = coachHtml(); };
  card();
  try {
    const k = await call('coach', { date, items, totals: t, burn: b, weight: S.weight, act: S.act });
    if (S.date === date) { S.day = { ...S.day, coach: k }; cacheSet('day:' + date, { ...cacheGet('day:' + date), coach: k }); }
  } catch (e) {
    S.coachErr = e.message || String(e);
  } finally {
    S.coachLoading = false; card();
  }
}

// ---- 料理の写真（複数枚）から推定：居酒屋などで撮っておいた写真を、あとからまとめて選べる ----
function pickMealPhotos() {
  const meal = picker.arg;
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  inp.onchange = async () => {
    const files = [...inp.files].slice(0, 6);
    if (!files.length) return;
    sheet('<h2>写真を準備しています…</h2>');
    try {
      const photos = [];
      for (const f of files) photos.push(await shrink(f, 1280));
      picker = { mode: 'add', arg: meal, q: '', photos };

    } catch (e) { alert(e.message || e); openPicker('add', meal); }
  };
  inp.click();

// 画面の入力値を picker.ai に読み戻す
function readAi() {
  picker.ai.forEach((it, i) => {
    const g = k => { const el = document.getElementById(`ai-${k}-${i}`); return el ? el.value.trim() : null; };
    if (!it.master) it.name = g('name') || it.name;
    ['qty', 'kcal', 'p', 'f', 'c'].forEach(k => { const v = g(k); if (v != null && v !== '') it[k] = +v || 0; });
  });
}

async function addAiItems() {
  readAi();
  const reg = document.getElementById('ai-reg')?.checked, meal = picker.arg;
  document.querySelector('.sheet .btn-main').textContent = '追加しています…';
  for (const it of picker.ai) {
    if (!it.master && reg) {
      try { setFoods(await call('addFood', { name: it.name, unit: it.unit, kcal: it.kcal, p: it.p, f: it.f, c: it.c })); it.master = it.name; }
      catch (e) { /* 同じ名前が既にあるときなどは「今回だけ」で入れる */ }
    }
  }
  if (reg) saveBase();
  picker.ai.forEach(it => {
    const qty = it.qty > 0 ? it.qty : 1;
    if (it.master && S.fmap[it.master]) S.items.push({ meal, name: it.master, qty });
    else S.items.push({ meal, name: it.name, qty, once: { unit: it.unit || '1個', kcal: it.kcal, p: it.p, f: it.f, c: it.c } });
  });
  closeSheet(); touch();
}

function editItem(idx) {
  const it = S.items[idx];
  if (S.fmap[it.name]) { picker.fromItem = true; return editFood(it.name); }
  openNewFood({ ...it.once, name: it.name, onceIdx: idx });
}
function submitOnceEdit(idx) {
  const food = readFoodForm(); if (!food) return;
  Object.assign(S.items[idx], { name: food.name, once: { unit: food.unit, kcal: +food.kcal || 0, p: +food.p || 0, f: +food.f || 0, c: +food.c || 0 } });
  closeSheet(); touch();
}

// ---- 登録済み食品の編集 ----
function editFood(name) {
  const f = S.fmap[name]; if (!f) return;
  openNewFood({ ...f, editName: name });
}
// 編集画面から戻る：食品の詳細から来たときは詳細へ、整理モードから来たときは整理モードへ
function backToEdit() {
  const fromItem = picker.fromItem, manage = picker.mode === 'manage';
  openPicker(picker.mode, picker.arg);
  if (!fromItem && !manage) toggleEdit();
}

async function submitEdit() {
  const food = readFoodForm(); if (!food) return;
  const old = document.getElementById('nf-old').value;
  const err = document.getElementById('nf-err');
  try {
    const d = await call('updateFood', old, food);
    setFoods(d.foods); S.sets = d.sets; saveBase();
    if (old !== food.name) S.items.forEach(it => { if (it.name === old) it.name = food.name; });
    backToEdit(); render();
  } catch (e) { err.textContent = e.message || String(e); }
}

function openFoods() {
  picker = { mode: 'manage', arg: null, q: '', edit: true };
  sheet(`<h2>食品リスト<button onclick="closeSheet()">閉じる</button></h2>
    <input id="pq" placeholder="検索" oninput="picker.q=this.value;renderPicks()">
    <div id="picks" class="list"></div>
    <div class="grid2" style="margin-top:10px">
      <button class="btn-soft" style="margin:0" onclick="pickPhoto()">写真から登録</button>
      <button class="btn-soft" style="margin:0" onclick="openNewFood()">＋ 手入力で登録</button>
    </div>`);
  renderPicks();
}
// 食品リストの専用ページへ（まだ送っていない変更は先に保存）
function goFoods() { flushSave(); location.href = 'foods.html' + location.hash; }

function toggleEdit() {
  picker.edit = !picker.edit;
  const b = document.getElementById('edit-btn'); if (b) b.textContent = picker.edit ? '完了' : '整理';
  renderPicks();
}

async function deleteFood(name) {
  if (!confirm(`「${name}」を食品リストから削除しますか？\n（これまでの記録はそのまま残ります）`)) return;
  // 画面上でこの食品を使っている行は、今の値を引き継いで「今回だけ」扱いにする
  const f = S.fmap[name];
  if (f) S.items.filter(it => it.name === name).forEach(it => { it.once = { unit: f.unit, kcal: f.kcal, p: f.p, f: f.f, c: f.c }; });
  try {
    const d = await call('deleteFood', name);
    setFoods(d.foods); S.sets = d.sets; saveBase();
    renderPicks();
  } catch (e) { alert('削除できませんでした: ' + (e.message || e)); }
}

function pick(name) {
  if (picker.mode === 'manage') return openFoods();
  if (picker.mode === 'add') S.items.push({ meal: picker.arg, name, qty: 1 });
  else { S.items[picker.arg].name = name; delete S.items[picker.arg].once; }
  closeSheet(); touch();
}

function openNewFood(v) {
  v = v || {};
  const val = x => x == null || x === '' ? '' : esc(x);
  const lbl = t => `<span class="sub" style="display:block;margin:8px 0 2px">${t}</span>`;
  const editing = v.editName != null, onceEdit = v.onceIdx != null;
  sheet(`<h2>${editing || onceEdit ? '食品を編集' : v.name != null ? '読み取り結果を確認' : '新しい食品を登録'}<button onclick="${editing ? 'backToEdit()' : 'openPicker(picker.mode, picker.arg)'}">戻る</button></h2>
    ${v.note ? `<div class="status ${v.source === 'estimate' ? 'copied' : 'ok'}" style="margin:0 0 8px">${v.source === 'estimate' ? '写真からの推定値です。' : '栄養成分表示から読み取りました。'}${esc(v.note)}</div>` : ''}
    ${lbl('食品名')}<input id="nf-name" placeholder="食品名（例：サバ缶）" value="${val(v.name)}">
    <input type="hidden" id="nf-old" value="${val(v.editName)}">
    <div class="grid2">
      <div>${lbl('1単位')}<input id="nf-unit" placeholder="例：50g、1個" value="${val(v.unit)}"></div>
      <div>${lbl('kcal')}<input id="nf-kcal" type="number" inputmode="decimal" value="${val(v.kcal)}"></div>
      <div>${lbl('P (g)')}<input id="nf-p" type="number" inputmode="decimal" value="${val(v.p)}"></div>
      <div>${lbl('F (g)')}<input id="nf-f" type="number" inputmode="decimal" value="${val(v.f)}"></div>
      <div>${lbl('C (g)')}<input id="nf-c" type="number" inputmode="decimal" value="${val(v.c)}"></div>
    </div>
    <div class="err" id="nf-err"></div>
    ${picker && picker.mode === 'manage' && !editing ? `<button class="btn-main" onclick="submitFood()">食品リストに登録</button>`
    : onceEdit ? `<button class="btn-main" onclick="submitOnceEdit(${v.onceIdx})">保存</button>
    <div class="sub" style="text-align:center;margin-top:8px">この日の記録だけが変わります</div>`
    : editing ? `<button class="btn-main" onclick="submitEdit()">保存</button>
    <div class="sub" style="text-align:center;margin-top:8px">過去の記録の数値は変わりません。今日以降に使う分から新しい値になります</div>`
    : `<button class="btn-main" onclick="addOnce()">今回だけ追加</button>
    <button class="btn-soft" onclick="submitFood()">食品リストにも登録して追加</button>
    <div class="sub" style="text-align:center;margin-top:8px">「今回だけ」は食品リストに残りません。よく買うものだけ登録がおすすめです</div>`}`);
}

// ---- 写真から読み取り（栄養成分表示・料理写真） ----
function pickPhoto() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => inp.files[0] && readPhoto(inp.files[0]);
  inp.click();
}

async function readPhoto(file) {
  sheet(`<h2>読み取り中…</h2><div class="sub" style="padding:24px 0;text-align:center">写真から栄養成分を読み取っています。<br>10〜20秒ほどかかります</div>`);
  try {
    const r = await call('readLabel', await shrink(file), 'image/jpeg');
    if (!r.name) throw new Error('食品や栄養成分表示が見つかりませんでした。表示が写るように撮り直してください');
    openNewFood(r);
  } catch (e) {
    sheet(`<h2>読み取れませんでした<button onclick="openPicker(picker.mode, picker.arg)">戻る</button></h2>
      <div class="err">${esc(e.message || e)}</div>
      <button class="btn-main" onclick="pickPhoto()">もう一度撮る</button>
      <button class="btn-soft" onclick="openNewFood()">手入力で登録</button>`);
  }
}

// 送る前に縮小してJPEGにする（通信量と読み取り時間を減らす）
function shrink(file, max = 1568) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(img.src);
      res(cv.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => rej(new Error('画像を開けませんでした'));
    img.src = URL.createObjectURL(file);
  });
}

function readFoodForm() {
  const v = id => document.getElementById(id).value.trim();
  const food = { name: v('nf-name'), unit: v('nf-unit') || '1個', kcal: v('nf-kcal'), p: v('nf-p'), f: v('nf-f'), c: v('nf-c') };
  const err = document.getElementById('nf-err');
  if (!food.name) { err.textContent = '食品名を入力してください'; return null; }
  if (food.kcal === '') { err.textContent = 'kcalを入力してください'; return null; }
  return food;
}

// 食品リストに登録せず、この日の記録にだけ追加する
function addOnce() {
  const food = readFoodForm(); if (!food) return;
  const once = { unit: food.unit, kcal: +food.kcal || 0, p: +food.p || 0, f: +food.f || 0, c: +food.c || 0 };
  if (picker.mode === 'add') S.items.push({ meal: picker.arg, name: food.name, qty: 1, once });
  else Object.assign(S.items[picker.arg], { name: food.name, once });
  closeSheet(); touch();
}

async function submitFood() {
  const food = readFoodForm(); if (!food) return;
  const err = document.getElementById('nf-err');
  try {
    setFoods(await call('addFood', food)); saveBase();
    pick(food.name);
  } catch (e) { err.textContent = e.message || String(e); }
}

// ---- セット ----
function openSets(meal) {
  const mealItems = S.items.filter(i => i.meal === meal && i.qty > 0);
  sheet(`<h2>セット（${meal}）<button onclick="closeSheet()">閉じる</button></h2>
    <div class="list">${S.sets.map((s, i) => `<button class="pick" onclick="applySet(${i},'${meal}')">
      <span>${esc(s.name)}</span><span class="sub">${esc(s.items.map(x => x.name + '×' + x.qty).join('・'))}</span></button>`).join('')
      || '<div class="sub" style="padding:14px">まだセットがありません</div>'}</div>
    ${mealItems.length ? `<button class="btn-soft" onclick="saveAsSet('${meal}')">今の${meal}の内容をセットとして保存</button>` : ''}`);
}

function applySet(i, meal) {
  S.sets[i].items.forEach(x => {
    const ex = S.items.find(it => it.meal === meal && it.name === x.name);
    if (ex) ex.qty += x.qty; else S.items.push({ meal, name: x.name, qty: x.qty });
  });
  closeSheet(); touch();
}

async function saveAsSet(meal) {
  const name = prompt('セット名', `いつもの${meal}`);
  if (!name) return;
  try {
    S.sets = await call('saveSet', name.trim(), S.items.filter(i => i.meal === meal && i.qty > 0 && S.fmap[i.name]).map(i => ({ name: i.name, qty: i.qty })));
    saveBase();
    openSets(meal);
  } catch (e) { alert('保存できませんでした: ' + (e.message || e)); }
}

// 画面に戻ってきたら最新を読み直す（別の端末で保存した内容を反映するため）
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && S.day) return flushSave(); // アプリを閉じる前に保存
  if (document.visibilityState !== 'visible' || !S.day || S.dirty || S.sending || sheetOpen()) return;
  call('getInit', S.date).then(applyInit).catch(() => {}); // 設定や食品マスタの変更も取り込む
});

init();
</script>
