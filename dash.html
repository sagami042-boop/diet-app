<body>
<div class="wrap">
  <div class="top">
    <h1>ダッシュボード</h1>
    <span data-burger></span>
    <div class="seg" id="gran">
      <button data-g="day" class="on">日毎</button><button data-g="week">週毎</button><button data-g="month">月毎</button>
    </div>
    <div class="seg" id="seg">
      <button data-n="30" class="on">30日</button><button data-n="90">90日</button><button data-n="0">全期間</button>
    </div>
  </div>
  <div id="body"><div class="empty">読み込み中…</div></div>
</div>

<script>
let D = null, N = 30, G = 'day', charts = [];
const RV = { kind: 'week', start: null, busy: false, err: '' };
const periodStart = (kind, date) => {
  const d = new Date(date + 'T00:00:00');
  if (kind === 'month') return ymd(new Date(d.getFullYear(), d.getMonth(), 1));
  d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); // 月曜はじまり
};
const periodEnd = (kind, start) => {
  const d = new Date(start + 'T00:00:00');
  return kind === 'month' ? ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0)) : ymd(new Date(d.getTime() + 6 * 864e5));
};

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = (n, d = 0) => n == null || isNaN(n) ? '–' : n.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
const md = s => { const [, m, d] = s.split('-'); return `${+m}/${+d}`; };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;

// 前回のデータですぐ表示し、裏で最新を取って変わっていれば描き直す
const hit = cacheGet('dash');
if (hit) { D = hit; render(); }
call('getDashboard').then(d => {
  cacheSet('dash', d);
  if (JSON.stringify(d) !== JSON.stringify(hit)) { D = d; render(); }
}).catch(e => {
  if (!hit) document.getElementById('body').innerHTML = `<div class="empty">読み込めませんでした。<br>${e.message || e}</div>`;
});

function setPeriod(n) {
  N = n;
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', +x.dataset.n === n));
}
document.getElementById('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  setPeriod(+b.dataset.n); render();
});
// 集計の単位。切り替えたら見やすい期間に合わせる（日毎→30日、週毎→90日、月毎→全期間）
document.getElementById('gran').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  G = b.dataset.g;
  document.querySelectorAll('#gran button').forEach(x => x.classList.toggle('on', x === b));
  setPeriod({ day: 30, week: 90, month: 0 }[G]); render();
});

// 日ごとのデータを、週（月曜はじまり）や月ごとにまとめる
function groups(S) {
  const keyOf = date => {
    if (G === 'day') return date;
    if (G === 'month') return date.slice(0, 7);
    const d = new Date(date + 'T00:00:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d);
  };
  const map = new Map();
  S.forEach(d => { const k = keyOf(d.date); if (!map.has(k)) map.set(k, []); map.get(k).push(d); });
  const years = new Set([...map.keys()].map(k => k.slice(0, 4)));
  return [...map].map(([k, days]) => {
    const logged = days.filter(d => d.logged), ws = days.filter(d => d.weight != null), st = days.filter(d => d.act && d.act.steps);
    const bal = logged.length ? logged.reduce((x, d) => x + d.bal, 0) : null;
    return {
      key: k, days, n: logged.length,
      label: G === 'day' ? md(k) : G === 'week' ? md(k) + '〜' : (years.size > 1 ? k.slice(0, 4) + '/' : '') + (+k.slice(5)) + '月',
      kcal: avg(logged.map(d => d.kcal)), p: avg(logged.map(d => d.p)), f: avg(logged.map(d => d.f)), c: avg(logged.map(d => d.c)),
      burn: avg(days.map(d => d.burn.total)), bal,
      weight: avg(ws.map(d => d.weight)), wAvg: G === 'day' ? days[0].wAvg : null,
      steps: avg(st.map(d => d.act.steps)), runKm: days.reduce((x, d) => x + ((d.act && d.act.runKm) || 0), 0),
    };
  });
}

// 期間内の日付を連続で並べる（記録のない日も軸に残す）
function series() {
  if (!D.days.length) return [];
  const map = {}; D.days.forEach(d => map[d.date] = d);
  const last = new Date(), first = new Date(N ? Date.now() - (N - 1) * 864e5 : D.days[0].date + 'T00:00:00');
  const out = [];
  for (let d = new Date(first.getFullYear(), first.getMonth(), first.getDate()); d <= last; d.setDate(d.getDate() + 1)) {
    const k = ymd(d); out.push(map[k] || { date: k, kcal: 0, p: 0, f: 0, c: 0, logged: false, weight: null });
  }
  // 体重の7日移動平均（その日を含む直近7日にある記録の平均）
  const all = D.days.filter(d => d.weight != null);
  out.forEach(o => {
    const from = ymd(new Date(new Date(o.date + 'T00:00:00').getTime() - 6 * 864e5));
    o.wAvg = avg(all.filter(w => w.date >= from && w.date <= o.date).map(w => w.weight));
    const lw = [...all].reverse().find(w => w.date <= o.date);
    o.burn = burn(o.wAvg || (lw && lw.weight) || D.conf.weight || 60, o.act || {});
    o.bal = o.logged ? o.kcal - o.burn.total : null;
  });
  return out;
}

// 消費カロリー（目安）＝ 基礎代謝×活動係数 ＋ 歩行 ＋ ランニング ＋ その他運動（入力画面と同じ式）
function burn(w, a) {
  const c = D.conf;
  const bmr = c.height && c.age && c.sex ? 10 * w + 6.25 * c.height - 5 * c.age + (c.sex.startsWith('女') ? -161 : 5) : null;
  const base = bmr ? bmr * c.factor : w * 30;
  const walk = (a.steps || 0) * w * 0.0004, run = (a.runKm || 0) * w, other = a.other || 0;
  return { base, walk, run, other, total: base + walk + run + other, rough: !bmr };
}

// 推定維持カロリー：直近28日の平均摂取 − 体重の傾き×7200kcal/kg
function maintenance() {
  const from = ymd(new Date(Date.now() - 27 * 864e5));
  const recent = D.days.filter(d => d.date >= from);
  const eaten = recent.filter(d => d.logged), ws = recent.filter(d => d.weight != null);
  if (eaten.length < 14 || ws.length < 7) return { ok: false, need: Math.max(0, 14 - eaten.length) };
  const xs = ws.map(w => new Date(w.date + 'T00:00:00').getTime() / 864e5), ys = ws.map(w => w.weight);
  const mx = avg(xs), my = avg(ys);
  const slope = xs.reduce((s, x, i) => s + (x - mx) * (ys[i] - my), 0) / xs.reduce((s, x) => s + (x - mx) ** 2, 0);
  return { ok: true, kcal: avg(eaten.map(d => d.kcal)) - slope * 7200, perWeek: slope * 7 };
}

// ---- 目標体重の到達予測 ----
// 直近4週間の体重から1日あたりの傾き（回帰直線）を出し、そのペースが続いた場合に目標に届く日を予測する
function forecast(c, cur) {
  const today = new Date(ymd(new Date()) + 'T00:00:00');
  const from = ymd(new Date(today.getTime() - 27 * 864e5));
  const ws = D.days.filter(d => d.weight != null && d.date >= from);
  const span = ws.length ? (new Date(ws[ws.length - 1].date) - new Date(ws[0].date)) / 864e5 : 0;
  if (ws.length < 5 || span < 7) return { ok: false, need: Math.max(0, 5 - ws.length), span };
  const xs = ws.map(w => (new Date(w.date + 'T00:00:00') - today) / 864e5), ys = ws.map(w => w.weight);
  const mx = avg(xs), my = avg(ys);
  const slope = xs.reduce((s, x, i) => s + (x - mx) * (ys[i] - my), 0) / xs.reduce((s, x) => s + (x - mx) ** 2, 0);
  cur = cur || ys[ys.length - 1];
  const r = { ok: true, slope, perWeek: slope * 7, cur, n: ws.length };
  if (c.weight && cur > c.weight && slope < -0.005) { // 週0.035kg以上減っているときだけ日付を出す
    r.days = Math.ceil((cur - c.weight) / -slope);
    const d = new Date(today.getTime() + r.days * 864e5);
    r.date = ymd(d); r.dateLabel = `${d.getFullYear() !== today.getFullYear() ? d.getFullYear() + '年' : ''}${d.getMonth() + 1}月${d.getDate()}日`;
  }
  const g = D.goal || {};
  if (g.date && g.date >= ymd(today)) {
    const dr = (new Date(g.date + 'T00:00:00') - today) / 864e5;
    r.race = { name: g.name, date: g.date, days: Math.round(dr), w: cur + slope * dr };
  }
  return r;
}

function forecastHtml(f, c) {
  const head = '<h2>目標体重の到達予測</h2>';
  if (!c.weight) return head + '<div class="cap">設定に目標体重がありません</div>';
  if (!f.ok) return head + `<div class="cap" style="margin-top:6px">体重の記録が足りません。直近4週間で5回以上、1週間以上の期間にわたって測ると予測できます${f.need ? `（あと${f.need}回）` : ''}。</div>`;
  const sign = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + fmt(Math.abs(n), 2);
  const main = f.cur <= c.weight ? `<div class="fc-main"><b>目標達成中</b><span>7日平均が目標の${fmt(c.weight, 1)}kgを下回っています</span></div>`
    : f.date ? `<div class="fc-main"><b>${f.dateLabel}ごろ</b><span>あと約${f.days}日（${fmt(f.cur - c.weight, 1)}kg）で ${fmt(c.weight, 1)}kg に届く見込み</span></div>`
    : `<div class="fc-main"><b class="flat">今のペースでは届きません</b><span>直近4週間で体重が${f.perWeek >= 0 ? '増えている' : 'ほとんど減っていない'}ため、到達日を計算できません</span></div>`;
  return head + main + `<div class="fc-rows">
      <div><span>今の体重（7日平均）</span><b>${fmt(f.cur, 1)}kg</b></div>
      <div><span>ペース（直近4週間）</span><b class="${f.perWeek < 0 ? 'good' : 'bad'}">${sign(f.perWeek)}kg/週</b></div>
      ${f.race ? `<div><span>大会の日（${md(f.race.date)}）の予測</span><b>${fmt(f.race.w, 1)}kg</b></div>` : ''}
    </div>
    <div class="cap" style="margin-top:8px">直近4週間の${f.n}回の体重から計算。今のペースが続いた場合の目安です</div>`;
}

// ---- トレーナーの振り返り（週・月） ----
function shiftPeriod(n) {
  const d = new Date(RV.start + 'T00:00:00');
  RV.start = RV.kind === 'month' ? ymd(new Date(d.getFullYear(), d.getMonth() + n, 1)) : ymd(new Date(d.getTime() + n * 7 * 864e5));
  RV.err = ''; renderReview();
}
function setKind(k) { RV.kind = k; RV.start = periodStart(k, ymd(new Date())); RV.err = ''; renderReview(); }

function renderReview() {
  const el = document.getElementById('review'); if (!el) return;
  if (!RV.start) RV.start = periodStart(RV.kind, ymd(new Date()));
  const today = ymd(new Date()), end = periodEnd(RV.kind, RV.start);
  const isCur = RV.start <= today && today <= end, future = RV.start > today;
  const label = RV.kind === 'month' ? `${+RV.start.slice(5, 7)}月` : `${md(RV.start)}〜${md(end)}`;
  const v = (D.reviews || []).find(x => x.kind === RV.kind && x.start === RV.start);
  const unit = RV.kind === 'month' ? '月' : '週';
  const sign = n => n == null ? '–' : (n > 0 ? '+' : n < 0 ? '−' : '±') + fmt(Math.abs(n), Number.isInteger(n) ? 0 : 1);
  const li = (arr, mark, col) => (arr || []).map(x => `<li><span style="color:var(${col})">${mark}</span>${x}</li>`).join('');
  let body;
  if (RV.busy) body = '<div class="cap" style="padding:14px 0">トレーナーが振り返っています…（20〜40秒）</div>';
  else if (v) {
    const st = v.stats || {}, pv = v.prev || {};
    const diff = (a, b, d = 0) => a != null && b != null ? `<small class="${a - b > 0 ? 'up' : 'dn'}">${a - b > 0 ? '+' : a - b < 0 ? '−' : '±'}${fmt(Math.abs(a - b), d)}</small>` : '';
    body = `<div class="rv-stats">
        <div><span>記録</span><b>${st.logged}/${st.days}<small>日</small></b></div>
        <div><span>平均摂取</span><b>${fmt(st.kcal)}<small>kcal</small></b>${diff(st.kcal, pv.kcal)}</div>
        <div><span>体重（7日平均）</span><b>${sign(st.wDiff)}<small>kg</small></b><small>${fmt(st.w0, 1)}→${fmt(st.w1, 1)}</small></div>
        <div><span>収支合計</span><b>${sign(st.bal)}<small>kcal</small></b><small>脂肪 ${sign(st.fat)}g</small></div>
        <div><span>ランニング</span><b>${fmt(st.runKm, 1)}<small>km</small></b>${diff(st.runKm, pv.runKm, 1)}</div>
        <div><span>予定の実施</span><b>${st.planned ? st.done + '/' + st.planned : '–'}</b></div>
      </div>
      <div class="rv">
        <p class="sum">${v.summary}</p>
        ${v.good && v.good.length ? `<h4>よかった点</h4><ul>${li(v.good, '○', '--ok')}</ul>` : ''}
        ${v.issues && v.issues.length ? `<h4>課題</h4><ul>${li(v.issues, '△', '--danger')}</ul>` : ''}
        ${v.focus && v.focus.length ? `<h4>次の${unit}の重点</h4><ul>${li(v.focus, '→', '--accent')}</ul>` : ''}
        <div class="cap">${v.at} に作成${isCur ? '（期間の途中時点）' : ''}。数字の小さな＋−は前の${unit}との差</div>
      </div>
      <button class="rv-btn soft" onclick="makeReview()">最新の記録で振り返り直す</button>`;
  } else if (future) body = '<div class="cap" style="padding:14px 0">まだ始まっていない期間です</div>';
  else body = `<div class="cap" style="padding:8px 0">食事・体重・ランニング・相談の内容をまとめて、前の${unit}と比べて振り返ります。${isCur ? '今の' + unit + 'はまだ途中なので、途中経過の振り返りになります。' : ''}</div>
      <button class="rv-btn" onclick="makeReview()">この${unit}を振り返ってもらう</button>`;
  el.innerHTML = `<div class="rv-head"><h2>トレーナーの振り返り</h2>
      <div class="seg"><button class="${RV.kind === 'week' ? 'on' : ''}" onclick="setKind('week')">週</button><button class="${RV.kind === 'month' ? 'on' : ''}" onclick="setKind('month')">月</button></div></div>
    <div class="rv-nav"><button onclick="shiftPeriod(-1)" aria-label="前へ">‹</button><b>${label}</b>${isCur ? '<span class="now">今' + unit + '</span>' : ''}<button onclick="shiftPeriod(1)" aria-label="次へ" ${future || isCur ? 'style="visibility:hidden"' : ''}>›</button></div>
    ${body}${RV.err ? `<div class="cap" style="color:var(--danger)">${RV.err}</div>` : ''}`;
}

async function makeReview() {
  RV.busy = true; RV.err = ''; renderReview();
  try { D.reviews = await call('makeReview', RV.kind, RV.start); cacheSet('dash', D); }
  catch (e) { RV.err = e.message || String(e); }
  RV.busy = false; renderReview();
}

function render() {
  charts.forEach(c => c.destroy()); charts = [];
  const body = document.getElementById('body');
  if (!D.days.length) { body.innerHTML = '<div class="empty">まだ記録がありません。入力画面で記録すると、ここにグラフが出ます。</div>'; return; }
  const S = series(), c = D.conf;
  const logged = S.filter(d => d.logged);
  const lastW = [...D.days].reverse().find(d => d.weight != null);
  const nowAvg = [...S].reverse().find(d => d.wAvg != null);
  const last7 = logged.filter(d => d.date >= ymd(new Date(Date.now() - 6 * 864e5)));
  const k7 = avg(last7.map(d => d.kcal));
  const m = maintenance();
  const toGoal = nowAvg && c.weight ? nowAvg.wAvg - c.weight : null;
  const fc = forecast(c, nowAvg ? nowAvg.wAvg : null);
  if (window.setNavGoal) setNavGoal(`目標 <b>${fmt(c.weight, 1)}kg</b><br>7日平均 ${fmt(nowAvg && nowAvg.wAvg, 1)}kg${toGoal > 0 ? `（あと${fmt(toGoal, 1)}kg）` : ''}`);
  const balDays = S.filter(d => d.bal != null);
  const balAvg = avg(balDays.map(d => d.bal)), balSum = balDays.length ? balDays.reduce((x, d) => x + d.bal, 0) : null;
  const stepDays = S.filter(d => d.act && d.act.steps), stepAvg = avg(stepDays.map(d => d.act.steps));
  const runDays = S.filter(d => d.act && d.act.runKm).length, runKm = S.reduce((x, d) => x + ((d.act && d.act.runKm) || 0), 0);
  const burnAvg = avg(S.slice(-28).map(d => d.burn.total));
  const B = groups(S), unit = { day: '日', week: '週', month: '月' }[G];
  const sign = (v, txt) => v == null ? '–' : (v < 0 ? '−' : '+') + txt;
  const fatTxt = v => v == null ? '' : Math.abs(v) >= 7200 ? fmt(Math.abs(v) / 7200, 2) + 'kg' : fmt(Math.abs(v) / 7.2) + 'g';

  body.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="l">体重（7日平均）</div><div class="v">${fmt(nowAvg && nowAvg.wAvg, 1)}<small> kg</small></div>
        <div class="d">最新 ${lastW ? fmt(lastW.weight, 1) + 'kg（' + md(lastW.date) + '）' : '–'}</div></div>
      <div class="kpi"><div class="l">目標 ${fmt(c.weight, 1)}kg まで</div><div class="v">${toGoal == null ? '–' : toGoal <= 0 ? '達成' : fmt(toGoal, 1)}${toGoal > 0 ? '<small> kg</small>' : ''}</div>
        <div class="d">${fc.ok && fc.date && toGoal > 0 ? `${fc.dateLabel}ごろ到達の予測` : '&nbsp;'}</div></div>
      <div class="kpi"><div class="l">摂取kcal（7日平均）</div><div class="v">${fmt(k7)}<small> / ${fmt(c.kcal)} kcal</small></div>
        <div class="d">${last7.length}日分の記録から</div></div>
      <div class="kpi"><div class="l">推定維持カロリー</div><div class="v">${m.ok ? fmt(Math.round(m.kcal / 10) * 10) + '<small> kcal</small>' : '–'}</div>
        <div class="d">${m.ok ? `体重 ${m.perWeek >= 0 ? '+' : ''}${fmt(m.perWeek, 2)}kg/週（直近28日）` : `あと${m.need}日分の記録で算出`}${m.ok ? `<br>計算上の消費 ${fmt(Math.round(burnAvg / 10) * 10)}kcal` : ''}</div></div>
    </div>
    <div class="card fc" style="margin-top:12px">${forecastHtml(fc, c)}</div>
    <div class="card" style="margin-top:12px" id="review"></div>
    <div class="card" style="margin-top:12px"><h2>カロリー収支</h2><div class="cap">摂取 − 消費（目安）。下に伸びる緑＝赤字（減る方向）、上に伸びる赤＝黒字（増える方向）。脂肪1kg ≒ 7,200kcalで換算${S.some(d => d.burn.rough) ? '。身長・年齢・性別が未設定のため消費は仮の値' : ''}</div>
      <div class="kpis" style="margin-top:6px">
        <div class="kpi" style="background:var(--bg)"><div class="l">平均収支 / 日</div><div class="v" style="color:${balAvg < 0 ? 'var(--ok)' : 'var(--danger)'}">${balAvg == null ? '–' : (balAvg < 0 ? '−' : '+') + fmt(Math.abs(balAvg))}<small> kcal</small></div><div class="d">${balAvg == null ? '&nbsp;' : `脂肪 約${balAvg < 0 ? '−' : '+'}${fmt(Math.abs(balAvg) / 7.2)}g／日（${balDays.length}日）`}</div></div>
        <div class="kpi" style="background:var(--bg)"><div class="l">期間の合計</div><div class="v">${balSum == null ? '–' : (balSum < 0 ? '−' : '+') + fmt(Math.abs(balSum))}<small> kcal</small></div><div class="d">${balSum == null ? '&nbsp;' : `脂肪 約${balSum < 0 ? '−' : '+'}${fmt(Math.abs(balSum) / 7200, 2)}kg`}</div></div>
        <div class="kpi" style="background:var(--bg)"><div class="l">平均歩数</div><div class="v">${fmt(stepAvg)}<small> 歩</small></div><div class="d">入力した${stepDays.length}日</div></div>
        <div class="kpi" style="background:var(--bg)"><div class="l">ランニング合計</div><div class="v">${fmt(runKm, 1)}<small> km</small></div><div class="d">${runDays}回</div></div>
      </div>
      <div class="cap" style="margin-top:10px">${G === 'day' ? '日ごとの収支' : `${unit}ごとの収支の合計（記録した日の分）`}</div>
      <div class="chart" style="height:220px;margin-top:4px"><canvas id="cb"></canvas></div>
    </div>
    <div class="grid">
      <div class="card"><h2>体重</h2><div class="cap">${G === 'day' ? '点＝毎日の値、線＝7日平均' : `${unit}ごとの平均`}、点線＝目標</div><div class="chart"><canvas id="cw"></canvas></div></div>
      <div class="card"><h2>PFC（期間平均）</h2><div class="cap">記録した${logged.length}日の平均と目標</div><div id="pfc"></div></div>
    </div>
    <div class="card" style="margin-top:12px"><h2>摂取と消費</h2><div class="cap">${G === 'day' ? '' : `${unit}ごとの1日あたり平均。`}棒＝摂取、線＝消費（目安）、点線＝目標 ${fmt(c.kcal)}kcal。記録のない${unit}は空欄</div><div class="chart" style="height:220px"><canvas id="ck"></canvas></div>
      <details><summary>${unit}別の数値を表で見る</summary>
        <div style="overflow-x:auto"><table><thead><tr><th>${G === 'day' ? '日付' : G === 'week' ? '週' : '月'}</th><th>kcal${G === 'day' ? '' : '/日'}</th><th>P</th><th>F</th><th>C</th><th>消費${G === 'day' ? '' : '/日'}</th><th>収支${G === 'day' ? '' : '合計'}</th><th>脂肪</th><th>歩数</th><th>ラン</th><th>体重</th>${G === 'day' ? '' : '<th>記録</th>'}</tr></thead><tbody>
        ${[...B].reverse().filter(b => b.n || b.weight != null || b.steps || b.runKm).map(b => `<tr><td>${b.label}</td><td>${fmt(b.kcal)}</td><td>${fmt(b.p)}</td><td>${fmt(b.f)}</td><td>${fmt(b.c)}</td><td>${fmt(b.burn)}</td><td>${sign(b.bal, fmt(Math.abs(b.bal)))}</td><td>${sign(b.bal, fatTxt(b.bal))}</td><td>${fmt(b.steps)}</td><td>${b.runKm ? fmt(b.runKm, 1) + 'km' : '–'}</td><td>${fmt(b.weight, 1)}</td>${G === 'day' ? '' : `<td>${b.n}日</td>`}</tr>`).join('')}
        </tbody></table></div></details>
    </div>`;

  renderReview();
  const pfc = [['P（タンパク質）', 'p'], ['F（脂質）', 'f'], ['C（炭水化物）', 'c']];
  document.getElementById('pfc').innerHTML = pfc.map(([l, k]) => {
    const a = avg(logged.map(d => d[k])) || 0, g = c[k];
    return `<div class="pfc-row" style="background:var(--${k}-bg)"><div class="h"><span style="color:var(--${k})">${l}</span><span>${fmt(a)} / ${fmt(g)}g</span></div>
      <div class="track"><div style="width:${Math.min(100, g ? a / g * 100 : 0)}%;background:var(--${k})"></div></div></div>`;
  }).join('') + `<div class="cap" style="margin-top:14px">平均 ${fmt(avg(logged.map(d => d.kcal)))} kcal / 日</div>`;

  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.color = css('--sub');
  const grid = { color: css('--line'), drawTicks: false }, border = { display: false };
  const labels = B.map(b => b.label);
  const tip = { backgroundColor: css('--card'), titleColor: css('--text'), bodyColor: css('--text'), borderColor: css('--line'), borderWidth: 1, padding: 10 };
  const x = { grid: { display: false }, border, ticks: { maxTicksLimit: 8, maxRotation: 0 } };

  charts.push(new Chart(document.getElementById('cw'), {
    data: { labels, datasets: [
      ...(G === 'day' ? [
        { type: 'line', label: '7日平均', data: B.map(b => b.wAvg), borderColor: css('--accent'), borderWidth: 2.5, pointRadius: 0, tension: 0.3, spanGaps: true },
        { type: 'line', label: '体重', data: B.map(b => b.weight), showLine: false, pointRadius: 3, pointHoverRadius: 5, pointBackgroundColor: css('--accent-soft'), pointBorderWidth: 0 },
      ] : [
        { type: 'line', label: unit + '平均', data: B.map(b => b.weight), borderColor: css('--accent'), backgroundColor: css('--accent'), borderWidth: 2.5, pointRadius: 4, pointHoverRadius: 6, tension: 0.3, spanGaps: true },
      ]),
      { type: 'line', label: '目標', data: B.map(() => c.weight || null), borderColor: css('--muted'), borderWidth: 1, borderDash: [4, 4], pointRadius: 0 },
    ] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { ...tip, callbacks: { label: i => i.raw == null ? null : `${i.dataset.label} ${fmt(i.raw, 1)}kg` } } },
      scales: { x, y: { grid, border, ticks: { callback: v => fmt(v, 1) } } } },
  }));

  charts.push(new Chart(document.getElementById('ck'), {
    data: { labels, datasets: [
      { type: 'bar', label: '摂取', data: B.map(b => b.kcal == null ? null : Math.round(b.kcal)), backgroundColor: css('--accent'), borderRadius: 4, maxBarThickness: G === 'day' ? 18 : 36 },
      { type: 'line', label: '消費', data: B.map(b => Math.round(b.burn)), borderColor: css('--p'), borderWidth: 2, pointRadius: G === 'day' ? 0 : 3, tension: 0.2 },
      { type: 'line', label: '目標', data: B.map(() => c.kcal), borderColor: css('--muted'), borderWidth: 1, borderDash: [4, 4], pointRadius: 0 },
    ] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { ...tip, callbacks: { label: i => i.raw == null ? null : `${i.dataset.label} ${fmt(i.raw)}kcal` } } },
      scales: { x, y: { grid, border, beginAtZero: true, ticks: { callback: v => fmt(v) } } } },
  }));

  charts.push(new Chart(document.getElementById('cb'), {
    data: { labels, datasets: [
      { type: 'bar', label: '収支', data: B.map(b => b.bal == null ? null : Math.round(b.bal)),
        backgroundColor: B.map(b => b.bal != null && b.bal > 0 ? css('--danger') : css('--ok')), borderRadius: 4, maxBarThickness: G === 'day' ? 18 : 36 },
    ] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { ...tip, callbacks: { label: i => i.raw == null ? null : [`収支 ${i.raw > 0 ? '+' : ''}${fmt(i.raw)}kcal`, `脂肪 約${i.raw > 0 ? '+' : '−'}${fatTxt(i.raw)}`].concat(G === 'day' ? [] : [`（記録${B[i.dataIndex].n}日）`]) } } },
      scales: { x, y: { grid: { ...grid, color: ctx => ctx.tick.value === 0 ? css('--sub') : css('--line') }, border, ticks: { callback: v => fmt(v) } } } },
  }));
}
</script>
</body>
</html>
