<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ランニング</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="体型管理">

<meta name="theme-color" content="#0e161d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.png">

<script>const APP_VERSION = '20261028205901';</script>

<style>
  :root {
    --shadow: 0 1px 2px rgba(16,40,64,0.05), 0 6px 18px rgba(16,40,64,0.07); --shadow-lg: 0 10px 34px rgba(16,40,64,0.16);
    --bg: #f3f6f9; --card: #ffffff; --text: #18242f; --sub: #6a7b89; --line: #e1e8ee; --track: #e4ecf2;
    --accent: #1D90CC; --accent-soft: #e2f1fa; --on-accent: #ffffff; --danger: #CC1D29; --ok: #14895c; --ok-bg: #e1f3ea;
    --p: #1D90CC; --p-bg: #e2f1fa; --f: #8d8914; --f-bg: #f6f5d8; --c: #CC1D29; --c-bg: #fae3e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 6px 18px rgba(0,0,0,0.3); --shadow-lg: 0 10px 34px rgba(0,0,0,0.5);
      --bg: #0e161d; --card: #17222c; --text: #e6edf2; --sub: #8ea0ae; --line: #26333e; --track: #22303b;
      --accent: #3aa6de; --accent-soft: #133248; --on-accent: #0e161d; --danger: #e8545e; --ok: #5fd0a0; --ok-bg: #16362a;
      --p: #4fb0e3; --p-bg: #133248; --f: #d9d35a; --f-bg: #33321a; --c: #e8545e; --c-bg: #3a1a1e;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Outfit", "Zen Kaku Gothic New", -apple-system, "Hiragino Sans", sans-serif; font-feature-settings: "palt"; font-size: 15px; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:active { transform: scale(0.97); }
  input { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; outline: none; }
  input:focus { border-color: var(--accent); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 16px 18px 40px; }
  .top { display: flex; align-items: center; gap: 12px; }
  .top h1 { font-size: 26px; font-weight: 700; margin: 0; flex: 1; }
  .card { background: var(--card); border-radius: 20px; padding: 16px 18px; margin-top: 12px; }
  .card h2 { font-size: 17px; font-weight: 700; margin: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card h2 button { font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 6px 12px; flex: none; }
  .sub { font-size: 12px; color: var(--sub); }
  .goal { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; margin-top: 10px; }
  .goal .days { text-align: center; background: var(--accent-soft); color: var(--accent); border-radius: 16px; padding: 10px 14px; }
  .goal .days b { display: block; font-size: 30px; line-height: 1; }
  .goal .nm { font-size: 17px; font-weight: 700; }
  .kv { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px; font-size: 13px; color: var(--sub); }
  .kv b { color: var(--text); font-size: 15px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  label.l { display: block; font-size: 12px; color: var(--sub); margin: 10px 0 3px; }
  .btn-main { width: 100%; height: 46px; margin-top: 12px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .btn-soft { width: 100%; height: 42px; margin-top: 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .err { color: var(--danger); font-size: 13px; margin-top: 8px; }
  .summary { margin-top: 8px; font-size: 14px; line-height: 1.6; background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .plan { margin-top: 10px; }
  .pd { display: grid; grid-template-columns: 62px 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .pd:first-child { border-top: 0; }
  .pd.today { background: var(--accent-soft); border-radius: 12px; padding: 10px 8px; border-top-color: transparent; }
  .pd.past { opacity: 0.55; }
  .pd .dt { font-size: 13px; font-weight: 600; }
  .pd .dt small { display: block; font-weight: 400; color: var(--sub); font-size: 11px; }
  .pd .body { min-width: 0; }
  .pd .det { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .pd .res { font-size: 12px; text-align: right; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 2px 9px; margin-right: 6px; }
  .done { color: var(--ok); font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 10px; }
  .stat { background: var(--bg); border-radius: 14px; padding: 10px 12px; }
  .stat b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .stat b small { font-size: 12px; font-weight: 400; color: var(--sub); }
  .chart { position: relative; height: 200px; margin-top: 10px; }
  .adds { display: flex; gap: 8px; margin-top: 10px; }
  .adds button { flex: 1; height: 42px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .adds button.main { background: var(--accent); color: var(--on-accent); }
  .rl { display: grid; grid-template-columns: 54px 1fr auto 34px; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .rl .km { font-weight: 700; }
  .rl .x { width: 30px; height: 30px; border-radius: 50%; background: var(--bg); color: var(--sub); }
  .edit-run { background: var(--bg); border-radius: 14px; padding: 10px 12px; margin-top: 8px; display: grid; grid-template-columns: 1.3fr 0.8fr 1fr 0.7fr 34px; gap: 6px; align-items: end; }
  .edit-run label { font-size: 11px; color: var(--sub); display: block; margin-bottom: 2px; }
  .edit-run input { padding: 8px 6px; }
  .empty { color: var(--sub); text-align: center; padding: 18px 0; font-size: 14px; }
  .rl { cursor: pointer; }
  .vd { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .vd > div { background: var(--bg); border-radius: 14px; padding: 10px 12px; }
  .vd b { display: block; font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
  .vd small { display: block; font-size: 11px; color: var(--sub); }
  .pzs { margin-top: 10px; }
  .pz { display: grid; grid-template-columns: 34px 110px 1fr; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
  .pz:first-child { border-top: 0; }
  .pz .tag { text-align: center; margin: 0; }
  .pz b { font-variant-numeric: tabular-nums; }
  .chatlog { margin-top: 10px; max-height: 440px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 88%; padding: 10px 12px; border-radius: 16px; font-size: 14px; line-height: 1.6; word-break: break-word; }
  .msg small { display: block; font-size: 10px; color: var(--sub); margin-top: 4px; }
  .msg.me { align-self: flex-end; background: var(--accent-soft); border-bottom-right-radius: 4px; }
  .msg.co { align-self: flex-start; background: var(--bg); border-bottom-left-radius: 4px; }
  .msg.wait { color: var(--sub); }
  .thr { display: block; width: 100%; text-align: left; background: var(--bg); border-radius: 14px; padding: 12px 14px; margin-top: 8px; }
  .th-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .th-h b { font-size: 15px; }
  .th-l { font-size: 13px; line-height: 1.6; margin-top: 6px; }
  .th-l span { font-size: 11px; font-weight: 700; color: var(--accent); }
  .th-l.ok span { color: var(--ok); }
  .th-l.q span { color: var(--p); }
  .th-l .qq { white-space: pre-wrap; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .quick button { font-size: 12px; background: var(--bg); color: var(--text); border-radius: 99px; padding: 6px 10px; }
  .chatin { display: flex; gap: 8px; margin-top: 10px; align-items: flex-end; }
  .chatin textarea { min-height: 44px; flex: 1; }
  .chatin button { flex: none; height: 44px; padding: 0 16px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
  select { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; flex: none; }
  .bests { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 10px; }
  .bt { background: var(--bg); border-radius: 14px; padding: 10px 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
  .bt span { font-size: 12px; color: var(--sub); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .bt b { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
  .bt small { font-size: 11px; color: var(--sub); }
  .bt.empty-t b { color: var(--sub); }
  .race { font-style: normal; font-size: 10px; background: var(--accent); color: var(--on-accent); border-radius: 99px; padding: 1px 6px; }
  .seg2 { display: flex; background: var(--bg); border-radius: 99px; padding: 3px; }
  .seg2 button { flex: 1; padding: 8px; border-radius: 99px; color: var(--sub); }
  .seg2 button.on { background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .edit-run select, .edit-run div input[id^="a-race"] { padding: 8px 10px; }
  .rl .ic { font-size: 11px; color: var(--accent); font-weight: 600; margin-left: 4px; }
  .modal { position: fixed; inset: 0; background: rgba(10,20,30,0.35); display: none; align-items: flex-end; z-index: 20; }
  .modal.open { display: flex; }
  .modal .box { background: var(--bg); width: 100%; max-width: 640px; margin: 0 auto; border-radius: 24px 24px 0 0; padding: 16px 18px calc(20px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; }
  .modal h2 { font-size: 18px; margin: 0; display: flex; justify-content: space-between; align-items: center; }
  .modal h2 button { font-size: 13px; font-weight: 400; background: var(--card); border-radius: 99px; padding: 6px 12px; }
  .mets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .met { background: var(--card); border-radius: 14px; padding: 10px; }
  .met span { font-size: 11px; color: var(--sub); }
  .met b { display: block; font-size: 18px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .sec { background: var(--card); border-radius: 16px; padding: 12px 14px; margin-top: 10px; }
  .sec h3 { font-size: 14px; margin: 0 0 8px; }
  .sp { display: grid; grid-template-columns: 38px 52px 1fr 44px 42px; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; font-variant-numeric: tabular-nums; }
  .sp .bar { height: 10px; border-radius: 5px; }
  .sp .el { text-align: right; color: var(--sub); font-size: 12px; }
  textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; min-height: 90px; outline: none; resize: vertical; }
  textarea:focus { border-color: var(--accent); }
  .ana { font-size: 14px; line-height: 1.6; }
  .ana p { margin: 0 0 6px; }
  .ana ul { list-style: none; padding: 0; margin: 4px 0 8px; }
  .ana li { display: flex; gap: 6px; margin: 3px 0; }
  .ana li span { flex: none; font-weight: 700; }
  .ana h4 { font-size: 12px; color: var(--sub); margin: 8px 0 0; font-weight: 600; }
  @media (min-width: 900px) {
    .modal { align-items: center; }
    .modal .box { border-radius: 24px; }
    .wrap { padding: 24px 32px 40px; }
    .cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
    .cols .card:first-child { margin-top: 12px; }
  }
  .card, .met, .sec { box-shadow: var(--shadow); }
  .modal .box { box-shadow: var(--shadow-lg); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>ランニング</h1><span data-burger></span></div>
  <div id="goal" class="card"><div class="empty">読み込み中…</div></div>
  <div id="vdot" class="card"></div>
  <div id="bests" class="card"></div>
  <div class="cols">
    <div><div id="plan" class="card"></div><div id="chat" class="card"></div></div>
    <div><div id="runs" class="card"></div></div>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeRun()"><div class="box" id="mbox"></div></div>

<script>
let R = null, chart = null, goalEdit = false, adding = null; // adding: 追加前の確認中の記録
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const dt = s => new Date(s + 'T00:00:00');
const md = s => { const d = dt(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const wd = s => '日月火水木金土'[dt(s).getDay()];
const hms = sec => { sec = Math.round(sec); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = sec % 60; return (h ? `${h}:${String(m).padStart(2, '0')}` : m) + ':' + String(x).padStart(2, '0'); };
const pace = (sec, km) => sec && km ? hms(sec / km) + '/km' : '–';
// 「52:30」「1:05:20」「52」（分）を秒に
const toSec = t => { t = String(t || '').trim(); if (!t) return 0; const p = t.split(':').map(Number); if (p.some(isNaN)) return 0; return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : p[0] * 60; };
const TYPE = { 'Eジョグ': ['--ok-bg', '--ok'], 'ロング走': ['--p-bg', '--p'], 'Mペース走': ['--f-bg', '--f'], 'Tペース走': ['--accent-soft', '--accent'], 'Iインターバル': ['--c-bg', '--c'], 'Rレペ': ['--c-bg', '--c'],
  'イージー': ['--ok-bg', '--ok'], 'ペース走': ['--f-bg', '--f'], 'インターバル': ['--accent-soft', '--accent'], 'ロング走': ['--p-bg', '--p'], 'レース': ['--accent', '--on-accent'], '休養': ['--bg', '--sub'] };
const tag = t => { const [b, c] = TYPE[t] || ['--bg', '--sub']; return `<span class="tag" style="background:var(${b});color:var(${c})">${esc(t)}</span>`; };

function load(d) { R = d; cacheSet('run', d); render(); }

function render() {
  renderGoal(); renderVdot(); renderBests(); renderPlan(); renderChat(); renderRuns();
  const g = R.goal;
  if (window.setNavGoal) setNavGoal(g.name && g.date ? `${esc(g.name)}<br>あと <b>${Math.max(0, Math.round((dt(g.date) - dt(R.today)) / 864e5))}</b> 日` : '大会の目標を登録しましょう');
}

// ---- 大会の目標 ----
function renderGoal() {
  const g = R.goal, el = document.getElementById('goal');
  if (!g.name || goalEdit) {
    el.innerHTML = `<h2>大会の目標${g.name ? '<button onclick="goalEdit=false;renderGoal()">やめる</button>' : ''}</h2>
      <label class="l">大会名</label><input id="g-name" value="${esc(g.name)}" placeholder="例：〇〇マラソン">
      <div class="grid2">
        <div><label class="l">開催日</label><input id="g-date" type="date" value="${esc(g.date)}"></div>
        <div><label class="l">距離（km）</label><input id="g-km" type="number" inputmode="decimal" value="${g.km || ''}" placeholder="例：21.0975"></div>
      </div>
      <label class="l">目標タイム</label><input id="g-target" value="${esc(g.target)}" placeholder="例：1:59:59（なければ空欄）">
      <div class="err" id="g-err"></div>
      <button class="btn-main" onclick="saveGoal()">保存</button>`;
    return;
  }
  const days = Math.round((dt(g.date) - dt(R.today)) / 864e5), tsec = toSec(g.target);
  el.innerHTML = `<h2>大会の目標<button onclick="goalEdit=true;renderGoal()">編集</button></h2>
    <div class="goal">
      <div class="days">${days >= 0 ? `あと<b>${days}</b>日` : `<b>終了</b>`}</div>
      <div><div class="nm">${esc(g.name)}</div>
        <div class="kv"><span>${esc(g.date)}（${wd(g.date)}）</span><span>距離 <b>${g.km}</b>km</span>${tsec ? `<span>目標 <b>${esc(g.target)}</b></span><span>必要ペース <b>${pace(tsec, g.km)}</b></span>` : ''}</div></div>
    </div>`;
}

async function saveGoal() {
  const v = id => document.getElementById(id).value.trim();
  const g = { name: v('g-name'), date: v('g-date'), km: v('g-km'), target: v('g-target') };
  const err = document.getElementById('g-err');
  if (!g.name || !g.date || !g.km) { err.textContent = '大会名・開催日・距離を入力してください'; return; }
  if (g.target && !toSec(g.target)) { err.textContent = '目標タイムは「1:59:59」のように入力してください'; return; }
  try { goalEdit = false; load(await call('saveGoal', g)); } catch (e) { err.textContent = e.message || e; }
}

// ---- 練習スケジュール（今日から14日分） ----
function renderPlan() {
  const el = document.getElementById('plan');
  const from = ymd(new Date(dt(R.today).getTime() - 2 * 864e5)), to = ymd(new Date(dt(R.today).getTime() + 13 * 864e5));
  const plan = R.plan.filter(p => p.date >= from && p.date <= to);
  const ran = d => R.runs.filter(r => r.date === d);
  const rows = plan.map(p => {
    const rs = ran(p.date), km = rs.reduce((x, r) => x + r.km, 0);
    const res = rs.length ? `<span class="done">✓ ${km.toFixed(1)}km</span>` : p.date < R.today && p.type !== '休養' ? '<span class="sub">未実施</span>' : '';
    return `<div class="pd ${p.date === R.today ? 'today' : p.date < R.today ? 'past' : ''}">
      <div class="dt">${md(p.date)}（${wd(p.date)}）<small>${p.date === R.today ? '今日' : ''}</small></div>
      <div class="body">${tag(p.type)}${p.km ? `<b>${p.km}km</b>` : ''}${p.pace ? ` <span class="sub">${esc(p.pace)}</span>` : ''}${p.detail ? `<div class="det">${esc(p.detail)}</div>` : ''}</div>
      <div class="res">${res}</div></div>`;
  }).join('');
  el.innerHTML = `<h2>練習スケジュール${plan.length ? '<button onclick="toggleReplan()">組み直す</button>' : ''}</h2>
    ${R.planSummary && plan.length ? `<div class="summary">${esc(R.planSummary)}</div>` : ''}
    <div id="replan" style="display:${plan.length ? 'none' : 'block'}">
      ${plan.length ? '' : `<div class="sub" style="margin-top:8px">${R.goal.name ? '大会の目標と最近の走行記録から、トレーナーが今日から2週間分のメニューを組みます。' : '先に大会の目標を登録すると、それに合わせたメニューになります。'}</div>`}
      <label class="l">都合や希望（任意）</label>
      <input id="plan-note" placeholder="例：水曜は走れない／土曜にロング走したい／膝が少し痛い">
      <div class="err" id="plan-err"></div>
      <button class="btn-main" id="plan-btn" onclick="makePlan()">${plan.length ? 'この内容で組み直す' : 'トレーナーに2週間分を組んでもらう'}</button>
    </div>
    <div class="plan">${rows}</div>`;
}
function toggleReplan() { const r = document.getElementById('replan'); r.style.display = r.style.display === 'none' ? 'block' : 'none'; }

async function makePlan() {
  const btn = document.getElementById('plan-btn'), err = document.getElementById('plan-err');
  btn.textContent = 'トレーナーが組んでいます…（20〜40秒）'; btn.disabled = true;
  try { load(await call('makePlan', { start: R.today, note: document.getElementById('plan-note').value.trim() })); }
  catch (e) { err.textContent = e.message || e; btn.textContent = 'もう一度試す'; btn.disabled = false; }
}

// ---- コーチに相談（壁打ち） ----
let chatSending = null; // 送信中の自分の発言
const QUICK = ['今の自分の課題は？', '大会までにやるべきメニューは？', '目標タイムは現実的？', '後半に失速しないためには？'];
function renderChat() {
  const el = document.getElementById('chat');
  const msgs = (R.chat || []).slice();
  if (chatSending) msgs.push({ role: 'user', text: chatSending }, { role: 'assistant', text: '記録を見ながら考えています…', wait: true });
  el.innerHTML = `<h2>コーチに相談${(R.chat || []).length ? '<button onclick="clearChat()">新しい相談を始める</button>' : ''}</h2>
    <div class="sub" style="margin-top:4px">走行記録・自分のコメント・分析結果・大会目標・練習予定を踏まえて答えます。</div>
    <div class="chatlog" id="chatlog">${msgs.length ? msgs.map(m => `<div class="msg ${m.role === 'user' ? 'me' : 'co'}${m.wait ? ' wait' : ''}">${esc(m.text).replace(/\n/g, '<br>')}${m.at ? `<small>${esc(m.at)}</small>` : ''}</div>`).join('')
      : '<div class="sub" style="padding:10px 0">例えばこんなことが聞けます</div>'}</div>
    <div class="quick">${QUICK.map(q => `<button onclick="sendChat('${q}')" ${chatSending ? 'disabled' : ''}>${q}</button>`).join('')}</div>
    <div class="chatin"><textarea id="chat-in" rows="2" placeholder="相談したいことを書く（例：インターバルがきつくて最後まで走れない）"></textarea>
      <button onclick="sendChat()" ${chatSending ? 'disabled' : ''}>${chatSending ? '…' : '送信'}</button></div>
    <div class="err" id="chat-err"></div>
    ${(R.chat || []).length ? '<button class="btn-soft" onclick="planFromChat()">この相談を踏まえて予定を組み直す</button>' : ''}
    ${threadsHtml()}`;
  const log = document.getElementById('chatlog'); log.scrollTop = log.scrollHeight;
}

async function sendChat(text) {
  const inp = document.getElementById('chat-in');
  text = (text || inp.value).trim();
  if (!text || chatSending) return;
  chatSending = text; renderChat();
  try { const d = await call('coachChat', text); chatSending = null; load(d); }
  catch (e) { chatSending = null; renderChat(); document.getElementById('chat-in').value = text; document.getElementById('chat-err').textContent = e.message || e; }
}

// 新しい相談を始める：今の会話は要約されて「相談の履歴」に残る（消えない）
async function clearChat() {
  if (!confirm('新しい相談を始めますか？\n今の会話は要約して「相談の履歴」に残ります。')) return;
  const b = document.querySelector('#chat h2 button'); if (b) { b.textContent = '要約して保存中…'; b.disabled = true; }
  try { load(await call('newThread')); } catch (e) { alert(e.message || e); renderChat(); }
}

// 相談の履歴（成長ログ）
function threadsHtml() {
  const th = R.threads || [];
  if (!th.length) return '';
  const range = t => t.start && t.end && t.start !== t.end ? `${md(t.start)}〜${md(t.end)}` : t.start ? md(t.start) : '';
  return `<h2 style="margin-top:18px">相談の履歴（成長ログ）</h2>
    <div class="sub" style="margin-top:4px">新しい順。会話は全文そのまま保存されていて、タップすると当時のやりとりを読み返せます</div>
    ${th.map(t => `<button class="thr" onclick="openThread('${esc(t.id)}')">
      <div class="th-h"><b>${esc(t.title)}</b><span class="sub">${range(t)}・${t.n}件</span></div>
      ${(t.questions || []).length ? `<div class="th-l q"><span>聞いたこと</span>${t.questions.map(x => `<div class="qq">「${esc(x)}」</div>`).join('')}</div>` : ''}
      ${t.issues.length ? `<div class="th-l"><span>課題</span>${t.issues.map(x => `<div>・${esc(x)}</div>`).join('')}</div>` : ''}
      ${t.decisions.length ? `<div class="th-l ok"><span>決めたこと</span>${t.decisions.map(x => `<div>・${esc(x)}</div>`).join('')}</div>` : ''}
    </button>`).join('')}`;
}

async function openThread(id) {
  const t = (R.threads || []).find(x => x.id === id) || {};
  openId = null;
  const box = document.getElementById('mbox');
  box.innerHTML = `<h2>${esc(t.title || '相談')}<button onclick="closeRun()">閉じる</button></h2><div class="sub" style="padding:16px 0">読み込み中…</div>`;
  document.getElementById('modal').classList.add('open');
  try {
    const msgs = await call('getThread', id);
    box.innerHTML = `<h2>${esc(t.title || '相談')}<button onclick="closeRun()">閉じる</button></h2>
      <div class="chatlog" style="max-height:none">${msgs.map(m => `<div class="msg ${m.role === 'user' ? 'me' : 'co'}">${esc(m.text).replace(/\n/g, '<br>')}<small>${esc(m.at)}</small></div>`).join('')}</div>`;
  } catch (e) { box.innerHTML += `<div class="err">${esc(e.message || e)}</div>`; }
}

// 相談内容を踏まえて練習予定を作り直す（サーバー側で直近の会話も渡している）
async function planFromChat() {
  const r = document.getElementById('replan'); if (r) r.style.display = 'block';
  document.getElementById('plan').scrollIntoView({ behavior: 'smooth' });
  await makePlan();
}

// ---- 走行記録 ----
function renderRuns() {
  const el = document.getElementById('runs');
  const runs = R.runs;
  // 週ごとの距離（月曜はじまり、直近12週）
  const mon = s => { const d = dt(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
  const weeks = []; let w = dt(mon(R.today)); w.setDate(w.getDate() - 77);
  for (let i = 0; i < 12; i++) { weeks.push(ymd(w)); w.setDate(w.getDate() + 7); }
  const wkKm = weeks.map(k => runs.filter(r => mon(r.date) === k).reduce((x, r) => x + r.km, 0));
  const month = R.today.slice(0, 7), mKm = runs.filter(r => r.date.startsWith(month)).reduce((x, r) => x + r.km, 0);
  const last4 = wkKm.slice(-5, -1), avg4 = last4.reduce((x, y) => x + y, 0) / 4;
  const longest = runs.reduce((m, r) => Math.max(m, r.km), 0);
  el.innerHTML = `<h2>走行記録</h2>
    <div class="stats">
      <div class="stat"><span class="sub">今週</span><b>${wkKm[11].toFixed(1)}<small> km</small></b></div>
      <div class="stat"><span class="sub">今月</span><b>${mKm.toFixed(1)}<small> km</small></b></div>
      <div class="stat"><span class="sub">直近4週の平均</span><b>${avg4.toFixed(1)}<small> km/週</small></b></div>
      <div class="stat"><span class="sub">最長</span><b>${longest.toFixed(1)}<small> km</small></b></div>
    </div>
    <div class="chart"><canvas id="wk"></canvas></div>
    <div class="adds"><button class="main" onclick="pickGarmin()">Garminのファイルから追加</button></div>
    <div class="adds" style="margin-top:6px"><button onclick="pickShots()">スクショから追加</button><button onclick="manualRun()">手入力</button></div>
    <div id="adding"></div>
    <div style="margin-top:6px">${runs.length ? [...runs].reverse().slice(0, 40).map(r => `<div class="rl" onclick="if(!event.target.closest('.x'))openRun('${esc(r.id)}')">
      <span class="sub">${md(r.date)}（${wd(r.date)}）</span>
      <span><span class="km">${r.km}km</span> <span class="sub">${r.sec ? hms(r.sec) : ''}</span>${isRace(r) ? '<span class="ic">大会</span>' : ''}${r.memo ? '<span class="ic">メモ</span>' : ''}${r.analysis ? '<span class="ic">分析済</span>' : ''}</span>
      <span class="sub">${pace(r.sec, r.km)}${r.hr ? ` ・ ♥${r.hr}` : ''}</span>
      <button class="x" onclick="delRun('${esc(r.id)}')" aria-label="削除">×</button></div>`).join('') : '<div class="empty">まだ記録がありません</div>'}</div>`;
  renderAdding();
  if (chart) chart.destroy();
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  chart = new Chart(document.getElementById('wk'), {
    type: 'bar',
    data: { labels: weeks.map(k => md(k) + '〜'), datasets: [{ label: '距離', data: wkKm.map(x => Math.round(x * 10) / 10), backgroundColor: css('--accent'), borderRadius: 4, maxBarThickness: 26 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: i => `${i.raw}km` } } },
      scales: { x: { grid: { display: false }, ticks: { color: css('--sub'), maxRotation: 0, autoSkip: true, maxTicksLimit: 6 } }, y: { beginAtZero: true, grid: { color: css('--line') }, ticks: { color: css('--sub') } } } },
  });
}

// ---- VDOT とトレーニングペース（ダニエルズのランニング・フォーミュラ） ----

      <div><span class="sub">目標に必要なVDOT</span><b>${x.goal ?? '–'}</b>${x.goal && x.cur ? `<small>あと ${Math.max(0, Math.round((x.goal - x.cur) * 10) / 10)}</small>` : ''}</div>
    </div>

      ${row('E', 'Eジョグ', 'イージー・会話できる。週の大半', `${hms(p.E[0])}〜${hms(p.E[1])}`)}
      ${row('M', 'Mペース走', 'マラソンペース', hms(p.M))}
      ${row('T', 'Tペース走', '閾値・快適にきつい。20分前後', hms(p.T))}
      ${row('I', 'Iインターバル', '3〜5分×数本、同じ時間のジョグでつなぐ', hms(p.I))}

// ---- 距離別ベストと大会の参加履歴 ----
// 距離がぴったりでない練習は、平均ペースから目標距離のタイムに換算する
const CATS = [['5km', 5, 4.9, 5.6], ['10km', 10, 9.8, 10.9], ['15km', 15, 14.7, 15.9], ['20km', 20, 19.7, 20.9], ['ハーフ', 21.0975, 21.0, 21.7], ['30km', 30, 29.5, 31.5], ['フル', 42.195, 42.0, 43.0]];
const isRace = r => r.type === 'レース';
const raceName = r => (r.detail && r.detail.race) || '';
function catRuns(i) {
  const [, km, lo, hi] = CATS[i];
  return R.runs.filter(r => r.sec && r.km >= lo && r.km <= hi).map(r => ({ ...r, est: r.sec * km / r.km, exact: Math.abs(r.km - km) < 0.06 }));
}

function renderBests() {
  const el = document.getElementById('bests');
  const tiles = CATS.map((c, i) => {
    const list = catRuns(i);
    if (!list.length) return `<div class="bt empty-t"><span>${c[0]}</span><b>–</b><small>記録なし</small></div>`;
    const b = list.reduce((m, r) => r.est < m.est ? r : m);
    return `<button class="bt" onclick="openCat(${i})"><span>${c[0]}${isRace(b) ? '<i class="race">大会</i>' : ''}</span><b>${hms(b.est)}</b>
      <small>${hms(b.est / c[1])}/km ・ ${md(b.date)}${b.exact ? '' : ' ・ ペース換算'}</small><small>${list.length}回</small></button>`;
  }).join('');
  const races = R.runs.filter(isRace).slice().reverse();
  el.innerHTML = `<h2>距離別ベスト</h2>
    <div class="sub" style="margin-top:4px">練習とレースの両方から一番速い記録。距離をタップすると記録の推移が見られます</div>
    <div class="bests">${tiles}</div>
    <h2 style="margin-top:16px">大会の参加履歴</h2>
    ${races.length ? races.map(r => `<div class="rl" onclick="openRun('${esc(r.id)}')">
      <span class="sub">${r.date.slice(0, 4)}<br>${md(r.date)}</span>
      <span><b>${esc(raceName(r) || '大会名なし')}</b><br><span class="sub">${r.km}km</span></span>
      <span style="text-align:right"><b>${r.sec ? hms(r.sec) : '–'}</b><br><span class="sub">${pace(r.sec, r.km)}</span></span><span></span></div>`).join('')
      : '<div class="sub" style="margin-top:6px">走行記録の詳細で「レース」にすると、ここに並びます。</div>'}`;
}

function openCat(i) {
  openId = null;
  const c = CATS[i], list = catRuns(i).sort((a, b) => a.date.localeCompare(b.date));
  let best = Infinity;
  document.getElementById('mbox').innerHTML = `<h2>${c[0]}の記録<button onclick="closeRun()">閉じる</button></h2>
    <div class="sub" style="margin-top:4px">古い順。★はその時点での自己ベスト更新</div>
    <div class="sec">${list.map(r => {
      const pb = r.est < best; if (pb) best = r.est;
      return `<div class="rl" onclick="openRun('${esc(r.id)}')">
        <span class="sub">${r.date.slice(2, 4)}/${md(r.date)}</span>
        <span>${pb ? '<b style="color:var(--accent)">★</b> ' : ''}<b>${hms(r.est)}</b> <span class="sub">${hms(r.est / c[1])}/km</span><br>
          <span class="sub">${isRace(r) ? esc(raceName(r) || '大会') : '練習'} ・ ${r.km}km${r.exact ? '' : '（ペース換算）'}</span></span>
        <span></span><span></span></div>`;
    }).join('')}</div>`;
  document.getElementById('modal').classList.add('open');
}

// ---- 1回の走行の詳細：全項目・スプリット・自分のコメント・トレーナーの分析 ----
let openId = null, analyzing = false;
function openRun(id) {
  // 前に開いた記録の入力欄が残らないよう、中身を空にしてから描く（描き直し時の下書き保持は同じ記録の中だけ）
  if (openId !== id) document.getElementById('mbox').innerHTML = '';
  openId = id; kindRace = null; analyzing = false; renderRun(); document.getElementById('modal').classList.add('open'); }
function closeRun() { openId = null; document.getElementById('mbox').innerHTML = ''; document.getElementById('modal').classList.remove('open'); }

function renderRun() {
  const r = R.runs.find(x => x.id === openId); if (!r) return closeRun();
  const d = r.detail || {}, sp = (d.splits || []).filter(x => x.pace > 0);
  const met = (l, v) => v ? `<div class="met"><span>${l}</span><b>${v}</b></div>` : '';
  const avgP = r.sec && r.km ? r.sec / r.km : 0;
  const lo = sp.length ? Math.min(...sp.map(x => x.pace)) : 0, hi = sp.length ? Math.max(...sp.map(x => x.pace)) : 0;
  const memo = document.getElementById('run-memo')?.value;
  const a = r.analysis;
  const li = (arr, mark, col) => (arr || []).map(x => `<li><span style="color:var(${col})">${mark}</span>${esc(x)}</li>`).join('');
  document.getElementById('mbox').innerHTML = `
    <h2>${md(r.date)}（${wd(r.date)}）${d.start ? ` <span class="sub" style="font-weight:400">${esc(d.start)}〜</span>` : ''}<button onclick="closeRun()">閉じる</button></h2>
    <div class="mets">
      ${met('距離', r.km + 'km')}${met('ランニング時間', r.sec ? hms(r.sec) : '')}${met('平均ペース', avgP ? hms(avgP) + '/km' : '')}
      ${met('経過時間', d.elapsed ? hms(d.elapsed) : '')}${met('最速ペース', d.best ? hms(d.best) + '/km' : '')}${met('推定消費', d.kcal ? d.kcal + 'kcal' : '')}
      ${met('ピッチ', d.cadence ? d.cadence + '歩/分' : '')}${met('高低差', d.up || d.down ? `+${d.up || 0} / -${d.down || 0}m` : '')}${met('心拍（平均/最大）', r.hr ? r.hr + (d.hrMax ? ' / ' + d.hrMax : '') : '')}
      ${met('パワー（平均/NP）', d.power ? d.power + (d.np ? ' / ' + d.np : '') + 'W' : '')}${met('歩幅', d.stepLen ? d.stepLen + 'm' : '')}${met('上下動', d.vo ? d.vo + 'cm' + (d.vr ? `（${d.vr}%）` : '') : '')}
      ${met('接地時間', d.gct ? d.gct + 'ms' : '')}${met('トレーニング効果', d.te ? `有酸素 ${d.te} / 無酸素 ${d.teAn ?? '–'}` : '')}${met('気温', d.temp != null ? d.temp + '℃' : '')}
    </div>
    ${sp.length ? `<div class="sec"><h3>スプリット</h3>${sp.map(x => {
      const w = hi > lo ? 35 + 65 * (hi - x.pace) / (hi - lo) : 80; // 速い区間ほど長い棒
      const fast = avgP && x.pace < avgP;
      return `<div class="sp"><span class="sub">${x.km}km</span><b>${hms(x.pace)}</b><div class="bar" style="width:${w}%;background:var(${fast ? '--accent' : '--track'})"></div><span class="el hr">${x.hr ? '♥' + x.hr : ''}</span><span class="el">${x.elev > 0 ? '+' : ''}${x.elev}m</span></div>`;
    }).join('')}<div class="sub" style="margin-top:4px">棒が長いほど速い区間。青は平均ペースより速かった区間。♥は区間の平均心拍</div></div>` : ''}
    <div class="sec"><h3>区分</h3>
      <div class="seg2"><button class="${isRace(r) ? '' : 'on'}" onclick="setKind(false)">練習</button><button class="${isRace(r) ? 'on' : ''}" onclick="setKind(true)">レース（大会）</button></div>
      <input id="run-race" style="margin-top:8px;display:${isRace(r) ? 'block' : 'none'}" placeholder="大会名（例：湘南国際マラソン）" value="${esc(raceName(r))}">
    </div>
    <div class="sec"><h3>自分のコメント（感想・反省・体調など）</h3>
      <textarea id="run-memo" placeholder="例：後半きつかった。昼食から時間が空いていて空腹気味。右膝に少し違和感">${esc(memo != null ? memo : r.memo)}</textarea>
      <button class="btn-soft" id="memo-btn" onclick="saveMemo()">区分とコメントを保存</button>
    </div>
    <div class="sec"><h3>トレーナーの分析${a ? ` <span class="sub" style="font-weight:400">${esc(a.at || '')}</span>` : ''}</h3>
      ${analyzing ? '<div class="sub" style="padding:10px 0">走りを分析しています…（20〜30秒）</div>' : a ? `<div class="ana">
        <p><b>${esc(a.summary)}</b></p>
        ${a.good && a.good.length ? `<h4>よかった点</h4><ul>${li(a.good, '○', '--ok')}</ul>` : ''}
        ${a.lacking && a.lacking.length ? `<h4>足りていない点</h4><ul>${li(a.lacking, '△', '--accent')}</ul>` : ''}
        ${a.todo && a.todo.length ? `<h4>どうすればいいか</h4><ul>${li(a.todo, '→', '--p')}</ul>` : ''}
        <p class="summary"><b>次の練習：</b>${esc(a.next)}</p></div>` : '<div class="sub">数値・スプリット・コメント・練習予定・大会目標をもとに、足りない点と改善策を教えてくれます。コメントを書いてから頼むと、より具体的になります。</div>'}
      <div class="err" id="ana-err"></div>
      ${analyzing ? '' : `<button class="btn-main" onclick="analyzeRun()">${a ? 'コメントを踏まえてもう一度分析' : 'トレーナーに分析してもらう'}</button>`}
    </div>`;
}

// 区分（練習／レース）・大会名・コメントをまとめて保存
let kindRace = null;
function setKind(race) {
  kindRace = race;
  document.querySelectorAll('.seg2 button').forEach((b, i) => b.classList.toggle('on', (i === 1) === race));
  document.getElementById('run-race').style.display = race ? 'block' : 'none';
}
async function saveMemo() {
  const r = R.runs.find(x => x.id === openId), race = kindRace == null ? isRace(r) : kindRace;
  const v = { memo: document.getElementById('run-memo').value, type: race ? 'レース' : '練習', race: race ? document.getElementById('run-race').value.trim() : raceName(r) };
  const btn = document.getElementById('memo-btn');
  btn.textContent = '保存中…'; btn.disabled = true;
  try {
    load(await call('updateRun', openId, v)); kindRace = null; renderRun();
    const b2 = document.getElementById('memo-btn'); // 描き直したあとのボタンに「保存しました」を出す
    if (b2) { b2.textContent = '✓ 保存しました'; b2.style.background = 'var(--c-bg)'; b2.style.color = 'var(--ok)'; setTimeout(() => { if (b2.isConnected) { b2.textContent = '区分とコメントを保存'; b2.style.background = ''; b2.style.color = ''; } }, 2500); }
  } catch (e) { btn.textContent = '区分とコメントを保存'; btn.disabled = false; alert('保存できませんでした: ' + (e.message || e)); }
}

async function analyzeRun() {
  const memo = document.getElementById('run-memo').value, id = openId;
  analyzing = true; renderRun();
  try { load(await call('analyzeRun', id, memo)); }
  catch (e) { analyzing = false; renderRun(); document.getElementById('ana-err').textContent = e.message || e; return; }
  analyzing = false; if (openId === id) renderRun();
}

// 追加前の確認（スクショ読み取り結果・手入力）
function renderAdding() {
  const el = document.getElementById('adding'); if (!el) return;
  if (!adding) { el.innerHTML = ''; return; }
  if (adding.loading) { el.innerHTML = `<div class="summary">${adding.loading}</div>`; return; }
  if (!adding.list.length) { // 読み取りに失敗したとき
    el.innerHTML = adding.info ? `<div class="summary">${esc(adding.note)}</div><div class="adds"><button onclick="adding=null;renderAdding()">閉じる</button></div>`
      : `<div class="summary" style="color:var(--danger)">${esc(adding.note || '読み取れませんでした')}</div>
      <div class="adds"><button class="main" onclick="pickShots()">もう一度選ぶ</button><button onclick="adding=null;renderAdding()">閉じる</button></div>`;
    return;
  }
  el.innerHTML = `${adding.note ? `<div class="summary">${esc(adding.note)}</div>` : ''}
    ${adding.list.map((r, i) => `<div class="edit-run">
      <div><label>日付</label><input id="a-date-${i}" type="date" value="${esc(r.date)}"></div>
      <div><label>距離km</label><input id="a-km-${i}" type="number" inputmode="decimal" value="${r.km || ''}"></div>
      <div><label>時間</label><input id="a-time-${i}" value="${r.sec ? hms(r.sec) : ''}" placeholder="52:30"></div>
      <div><label>心拍</label><input id="a-hr-${i}" type="number" inputmode="numeric" value="${r.hr || ''}"></div>
      <div style="grid-column:1/-1;display:flex;gap:6px;order:9"><select id="a-type-${i}" onchange="document.getElementById('a-race-${i}').style.display=this.value==='レース'?'block':'none'"><option value="練習">練習</option><option value="レース" ${r.type === 'レース' ? 'selected' : ''}>レース（大会）</option></select>
        <input id="a-race-${i}" placeholder="大会名" value="${esc(r.race || '')}" style="display:${r.type === 'レース' ? 'block' : 'none'}"></div>
      <button class="x" style="width:30px;height:30px;border-radius:50%;background:var(--card);color:var(--sub)" onclick="readAdding();adding.list.splice(${i},1);renderAdding()" aria-label="外す">×</button>
    </div>`).join('')}
    <div class="err" id="a-err"></div>
    <div class="adds"><button class="main" onclick="saveRuns()">${adding.list.length}件を記録する</button><button onclick="adding=null;renderAdding()">やめる</button></div>`;
}
function readAdding() {
  adding.list.forEach((r, i) => {
    const v = k => document.getElementById(`a-${k}-${i}`)?.value.trim();
    r.date = v('date') || r.date; r.km = +v('km') || 0; r.sec = toSec(v('time')); r.hr = +v('hr') || null;
    r.type = v('type') || '練習'; r.race = r.type === 'レース' ? v('race') : '';
  });
}
function manualRun() { adding = { list: [{ date: R.today, km: '', sec: 0, hr: null }] }; renderAdding(); }

// Garmin の走行データ（.zip または .fit）を、このアプリの中で読み取る（AIは使わないので正確・無料）
function pickGarmin() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.fit,.zip,application/zip,application/octet-stream'; inp.multiple = true;
  inp.onchange = async () => {
    const files = [...inp.files]; if (!files.length) return;
    adding = { loading: `ファイル${files.length}件を読み取っています…` }; renderAdding();
    const list = [], errs = [];
    for (const f of files) {
      try { list.push(...await readGarminFile(f)); } catch (e) { errs.push(`${f.name}：${e.message || e}`); }
    }
    adding = list.length ? { list, note: `Garminのファイルから${list.length}件を読み取りました。${errs.length ? '読めなかったファイル：' + errs.join('、') : ''}` }
      : { list: [], note: errs.join('、') || '読み取れませんでした' };
    renderAdding();
  };
  inp.click();
}

function pickShots() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  inp.onchange = async () => {
    const files = [...inp.files].slice(0, 8); if (!files.length) return;
    adding = { loading: `スクリーンショット${files.length}枚を読み取っています…（10〜20秒）` }; renderAdding();
    try {
      const imgs = []; for (const f of files) imgs.push(await shrink(f, 1200, 0.8));
      const r = await call('readRunShots', imgs);
      if (!r.runs.length) throw new Error('走行記録が見つかりませんでした。距離や時間が写っている画面を選んでください');
      adding = { list: r.runs, note: r.note };
    } catch (e) { adding = { list: [], note: e.message || String(e) }; }
    renderAdding();
  };
  inp.click();
}

async function saveRuns() {
  readAdding();
  const list = adding.list.filter(r => r.date && r.km > 0);
  if (!list.length) { document.getElementById('a-err').textContent = '日付と距離を入力してください'; return; }
  try {
    const d = await call('addRuns', list);
    adding = d.skipped || d.updated ? { list: [], info: true, note: `${d.added}件を記録しました。${d.updated ? `${d.updated}件は同じ走行の記録をGarminの詳しいデータで更新しました（メモ・分析はそのまま）。` : ''}${d.skipped ? `${d.skipped}件はすでに記録済みのため飛ばしました。` : ''}` } : null;
    load(d);
  } catch (e) { document.getElementById('a-err').textContent = e.message || e; }
}

async function delRun(id) {
  if (!confirm('この記録を削除しますか？')) return;
  try { load(await call('deleteRun', id)); } catch (e) { alert(e.message || e); }
}

function shrink(file, max, q = 0.85) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(img.src);
      res(cv.toDataURL('image/jpeg', q).split(',')[1]);
    };
    img.onerror = () => rej(new Error('画像を開けませんでした'));
    img.src = URL.createObjectURL(file);
  });
}

// 前回のデータですぐ表示し、裏で最新を取る
const hit = cacheGet('run');
if (hit) { R = hit; render(); }
call('getRunning').then(d => { if (JSON.stringify(d) !== JSON.stringify(R)) load(d); })
  .catch(e => { if (!hit) document.getElementById('goal').innerHTML = `<div class="empty">読み込めませんでした。<br>${esc(e.message || e)}</div>`; });
</script>
